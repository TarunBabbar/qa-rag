# QABuddy knowledge sources.
#
# Providers:
#   local   - a folder on disk (`path`)
#   jira    - issues matching JIRA_JQL, via the Jira REST API
#   github  - a repo (`repo: owner/name`, `ref: branch`) pulled as one tarball
#
# `kind` picks the chunker:
#   jira   ticket body + one chunk per comment
#   docs   heading-aware sections
#   code   AST split per class / method / test (TS, JS, Java + configs, docs)
#
# API-backed sources are staged into a transient `data/_staging` tree for the
# duration of an ingest run and deleted afterwards: no data is kept locally.

sources:
  - id: jira
    label: JIRA (stories, test cases, bugs)
    kind: jira
    provider: jira
    description: Stories, test cases and bugs from the QAB project

  - id: github
    label: Automation code (GitHub)
    kind: code
    provider: github
    repo: TarunBabbar/SampleTestAutomation
    ref: main
    description: Playwright UI + API automation for restful-booker-platform
