    priority: P1
    automated: true
    covers: RBP-AUTH
    summary: "TC: Admin login redirects to the admin area"
    precondition: "Admin login page is open."
    steps:
      - "Log in with admin/password"
      - "Assert the admin area is shown"
    expected: "Successful login lands on the admin dashboard."
  - id: TC-AUTH-004
    module: Auth
    type: UI
    priority: P1
    automated: true
    covers: RBP-AUTH
    summary: "TC: Logout ends the admin session"
    precondition: "Logged in as admin."
    steps:
      - "Click logout"
      - "Assert the admin area is no longer reachable"
    expected: "Logout clears the session."
  - id: TC-AUTH-005
    module: Auth
    type: UI
    priority: P2
    automated: false
    covers: RBP-AUTH
    summary: "TC: Login shows an error for wrong credentials"
    precondition: "Admin login page is open."
    steps:
      - "Log in with admin/wrong"
      - "Assert an error message is shown"
    expected: "A clear error is displayed."
  - id: TC-AUTH-006
    module: Auth
    type: API
    priority: P1
    automated: true
    covers: RBP-NFR
    summary: "TC: Admin API rejects a request with no token"
    precondition: "No token."
    steps:
      - "GET /message without a token"
      - "Assert 401/403"
    expected: "Admin APIs are protected."
  - id: TC-AUTH-007
    module: Auth
    type: API
    priority: P2
    automated: true
    covers: RBP-NFR
    summary: "TC: Auth API rejects an empty password"
    precondition: "RBP API is reachable."
    steps:
      - "POST /auth/login with an empty password"
