bugs:
  - module: Booking
    priority: P1
    severity: High
    summary: "BUG: Booking with a past check-in date is accepted"
    found_by: TC-BOOK-004
    affects_story: RBP-DATES
    repro:
      - "POST /booking with checkin in the past and a valid checkout"
      - "Observe a booking id is returned"
    expected: "Past dates are rejected with a 4xx error."
    actual: "The booking is created successfully."
    notes: "No server-side date validation; only the UI blocks past dates."
  - module: Booking
    priority: P0
    severity: Critical
    summary: "BUG: Double-booking - same room can be booked for overlapping dates"
    found_by: TC-BOOK-006
    affects_story: RBP-AVAIL
    repro:
      - "Create a booking for room 1, dates D1-D3"
      - "Create a second booking for room 1, dates D2-D4"
    expected: "The second booking is rejected."
    actual: "Both bookings are accepted; the room is double-booked."
  - module: Booking
    priority: P1
    severity: High
    summary: "BUG: Boundary date overlap makes a free room appear unavailable"
    found_by: TC-BOOK-010
    affects_story: RBP-AVAIL
    repro:
      - "Room has a booking ending 2026-06-03"
      - "Request availability from 2026-06-03"
    expected: "The room is available from 2026-06-03."
    actual: "The room is excluded."
    notes: "Overlap check uses >= instead of >."
  - module: Booking
    priority: P2
    severity: Medium
    summary: "BUG: Missing last name returns HTTP 500 instead of a validation error"
    found_by: TC-BOOK-016
    affects_story: RBP-NFR
