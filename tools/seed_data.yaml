# QA Copilot seed data for the QAB Jira project.
# Target application: restful-booker-platform (https://automationintesting.online)
# Applied by tools/jira_seed.py (idempotent: matches on summary).

stories:
  - id: RBP-BOOK
    module: Booking
    priority: P0
    summary: "Public booking: a guest can book an available room"
    description: "As a guest I can search for an available room for my dates and complete a booking so that I have a reservation."
    acceptance:
      - "The booking form accepts first name, last name, email, phone and dates."
      - "A successful booking returns a booking id and is visible to the admin."
      - "An invalid submission shows a field-level error and creates no booking."

  - id: RBP-DATES
    module: Booking
    priority: P0
    summary: "Booking date rules are enforced"
    description: "Booking dates must be valid: check-out after check-in, no past dates, and a maximum stay."
    acceptance:
      - "Check-out on or before check-in is rejected."
      - "A check-in in the past is rejected."
      - "The error message names the offending field."

  - id: RBP-AVAIL
    module: Rooms
    priority: P0
    summary: "Room availability is derived from existing bookings"
    description: "A room is offered only when it has no overlapping booking for the requested date range."
    acceptance:
      - "A room with an overlapping booking is not returned for those dates."
      - "A room becomes available again once its bookings end."
      - "Overlap at the boundary dates (same check-in or check-out) is handled correctly."

  - id: RBP-INV
    module: Rooms
    priority: P1
    summary: "Admin can manage room inventory"
    description: "Admins can create, update and delete rooms, and see the current inventory."
    acceptance:
      - "A new room appears in the room list after creation."
      - "Editing a room updates the list."
      - "Deleting a room removes it from the list."

  - id: RBP-AUTH
    module: Auth
    priority: P0
    summary: "Admin login protects the admin area"
    description: "Only an authenticated admin can reach the admin pages and admin APIs."
    acceptance:
      - "Valid credentials (admin/password) return a token and open the admin area."
      - "Invalid credentials are rejected with an error and no token."
      - "Admin pages and admin APIs require the token."

  - id: RBP-MSG
    module: Messages
    priority: P1
    summary: "Guest enquiries reach the admin inbox"
    description: "A guest can send an enquiry; the admin can read and delete it."
    acceptance:
      - "The contact form creates a message visible in the admin inbox."
      - "Reading a message marks it as read."
      - "Deleting a message removes it from the inbox."

  - id: RBP-MOD
    module: Messages
    priority: P1
    summary: "Message input is validated and sanitised"
    description: "Message fields are validated and any HTML/script is neutralised before display."
    acceptance:
      - "Required fields are enforced."
      - "Email and phone are format-checked."
      - "Script in a message is not executed when the admin views it."

  - id: RBP-REP
    module: Report
    priority: P2
    summary: "Occupancy report summarises bookings and messages"
    description: "The report page shows the current rooms, bookings and messages."
    acceptance:
      - "The report lists rooms with their bookings."
      - "Message counts are shown."
      - "The report reflects changes after a booking is made."

  - id: RBP-BRAND
    module: Branding
    priority: P2
    summary: "Site branding is configurable"
    description: "An admin can change the site name and contact details, and the public site reflects them."
    acceptance:
      - "Updated branding appears on the public site."
      - "Invalid values are rejected."

  - id: RBP-NFR
    module: Cross
    priority: P1
    summary: "Non-functional: security, accessibility and resilience"
    description: "The site should be safe, usable by keyboard/screen-reader, and handle bad input without a 500."
    acceptance:
      - "Malformed input returns 4xx, not 5xx."
      - "Admin endpoints reject unauthenticated calls."
      - "Key pages are reachable by keyboard and have labelled fields."

tests:
  # ---------------- Booking (16) ----------------
  - id: TC-BOOK-001
    module: Booking
    type: API
    priority: P0
    automated: true
    covers: RBP-BOOK
    summary: "TC: Booking API creates a valid booking"
    precondition: "RBP API is reachable and at least one room exists."
    steps:
      - "POST /booking with valid guest details and a future date range"
      - "Assert HTTP 200 and a bookingid in the response"
      - "GET /booking/{id} and assert the details match"
    expected: "The booking is created, returned with an id, and retrievable."
  - id: TC-BOOK-002
    module: Booking
    type: UI
    priority: P0
    automated: true
    covers: RBP-BOOK
    summary: "TC: UI booking flow completes for an available room"
    precondition: "A room is available for the chosen dates."
    steps:
      - "Open the home page and pick an available date range"
      - "Select a room and fill the booking form"
      - "Submit and assert the confirmation is shown"
    expected: "The guest sees a confirmation and the booking exists in the admin area."
  - id: TC-BOOK-003
    module: Booking
    type: API
    priority: P0
    automated: true
    covers: RBP-DATES
    summary: "TC: Booking API rejects checkout before checkin"
    precondition: "RBP API is reachable."
    steps:
      - "POST /booking with checkout earlier than checkin"
      - "Assert the request is rejected (4xx) and no booking id is returned"
    expected: "The booking is rejected with a 4xx error and a message naming the dates."
  - id: TC-BOOK-004
    module: Booking
    type: API
    priority: P1
    automated: true
    covers: RBP-DATES
    summary: "TC: Booking API rejects a check-in in the past"
    precondition: "RBP API is reachable."
    steps:
      - "POST /booking with checkin in the past"
      - "Assert 4xx and no booking created"
    expected: "Past dates are rejected."
  - id: TC-BOOK-005
    module: Booking
    type: UI
    priority: P1
    automated: true
    covers: RBP-BOOK
    summary: "TC: Booking form shows field errors on empty submit"
    precondition: "Home page is open with a room selected."
    steps:
      - "Submit the booking form without filling required fields"
      - "Assert inline errors are shown for first name, last name, email and phone"
    expected: "Each invalid field shows an error and no booking is created."
  - id: TC-BOOK-006
    module: Booking
    type: API
    priority: P0
    automated: true
    covers: RBP-AVAIL
    summary: "TC: Booking API rejects a room already booked for the dates"
    precondition: "A room has an existing booking for the date range."
    steps:
      - "POST /booking for the same room and overlapping dates"
      - "Assert the request is rejected"
    expected: "Overlapping bookings are rejected."
  - id: TC-BOOK-007
    module: Booking
    type: API
    priority: P1
    automated: true
    covers: RBP-BOOK
    summary: "TC: Booking API validates the email format"
    precondition: "RBP API is reachable."
    steps:
      - "POST /booking with an invalid email"
      - "Assert 4xx and an email error"
    expected: "Malformed emails are rejected."
  - id: TC-BOOK-008
    module: Booking
    type: UI
    priority: P1
    automated: false
    covers: RBP-BOOK
    summary: "TC: Booking form is usable with the keyboard only"
    precondition: "Home page is open."
    steps:
      - "Tab through the booking form and fill it without a mouse"
      - "Submit with Enter"
    expected: "Every field is reachable and the form submits."
  - id: TC-BOOK-009
    module: Booking
    type: API
    priority: P2
    automated: true
    covers: RBP-DATES
    summary: "TC: Booking API accepts a same-day check-in and check-out next day"
    precondition: "RBP API is reachable."
    steps:
      - "POST /booking with checkin today and checkout tomorrow"
      - "Assert 200 and a booking id"
    expected: "A one-night booking is accepted."
  - id: TC-BOOK-010
    module: Booking
    type: API
    priority: P1
    automated: true
    covers: RBP-AVAIL
    summary: "TC: Boundary dates - checkout of booking A equals checkin of booking B"
    precondition: "Room has a booking ending on date D."
    steps:
      - "POST a new booking for the same room starting on D"
      - "Assert the new booking is accepted"
    expected: "Back-to-back bookings are allowed at the boundary."
  - id: TC-BOOK-011
    module: Booking
    type: API
    priority: P0
    automated: true
    covers: RBP-BOOK
    summary: "TC: Booking appears in the admin bookings list"
    precondition: "A booking has just been created via the API."
    steps:
      - "Authenticate as admin"
      - "GET /booking and assert the new booking is present with the correct room"
    expected: "The admin list includes the new booking."
  - id: TC-BOOK-012
    module: Booking
    type: UI
    priority: P1
    automated: true
    covers: RBP-BOOK
    summary: "TC: Booking summary shows the number of nights and total"
    precondition: "A valid date range is selected."
    steps:
      - "Select check-in and check-out dates"
      - "Assert the summary shows the correct night count"
    expected: "The night count equals the difference in days."
  - id: TC-BOOK-013
    module: Booking
    type: API
    priority: P2
    automated: true
    covers: RBP-BOOK
    summary: "TC: Booking API accepts an optional deposit flag"
    precondition: "RBP API is reachable."
    steps:
      - "POST /booking with depositpaid true"
      - "GET the booking and assert depositpaid is true"
    expected: "The deposit flag round-trips."
  - id: TC-BOOK-014
    module: Booking
    type: API
    priority: P1
    automated: true
    covers: RBP-NFR
    summary: "TC: Booking API returns 4xx (not 500) for malformed JSON"
    precondition: "RBP API is reachable."
    steps:
      - "POST /booking with an invalid JSON body"
      - "Assert the response is 4xx"
    expected: "Malformed input is handled gracefully."
  - id: TC-BOOK-015
    module: Booking
    type: UI
    priority: P2
    automated: false
    covers: RBP-BRAND
    summary: "TC: Booking page shows the configured site name"
    precondition: "Branding has been set by an admin."
    steps:
      - "Open the public booking page"
      - "Assert the header shows the configured site name"
    expected: "Branding is reflected on the booking page."
  - id: TC-BOOK-016
    module: Booking
    type: API
    priority: P2
    automated: true
    covers: RBP-BOOK
    summary: "TC: Booking API rejects a missing last name"
    precondition: "RBP API is reachable."
    steps:
      - "POST /booking without lastname"
      - "Assert 4xx"
    expected: "Missing required fields are rejected."

  # ---------------- Rooms (12) ----------------
  - id: TC-ROOM-001
    module: Rooms
    type: API
    priority: P0
    automated: true
    covers: RBP-INV
    summary: "TC: Room API creates a room"
    precondition: "Authenticated as admin."
    steps:
      - "POST /room with a unique room name and price"
      - "Assert 200 and a roomid"
      - "GET /room and assert the room is listed"
    expected: "The room is created and listed."
  - id: TC-ROOM-002
    module: Rooms
    type: API
    priority: P0
    automated: true
    covers: RBP-INV
    summary: "TC: Room API rejects an unauthenticated create"
    precondition: "No auth token."
    steps:
      - "POST /room without a token"
      - "Assert 401/403"
    expected: "Unauthenticated room creation is rejected."
  - id: TC-ROOM-003
    module: Rooms
    type: API
    priority: P1
    automated: true
    covers: RBP-INV
    summary: "TC: Room API updates a room"
    precondition: "A room exists."
    steps:
      - "PUT /room/{id} with a new price"
      - "GET /room/{id} and assert the price changed"
    expected: "Room updates are persisted."
  - id: TC-ROOM-004
    module: Rooms
    type: UI
    priority: P1
    automated: true
    covers: RBP-INV
    summary: "TC: Admin can create a room from the UI"
    precondition: "Logged in as admin."
    steps:
      - "Open Admin > Rooms and add a room"
      - "Assert the new room appears in the list"
    expected: "The UI creates the room."
  - id: TC-ROOM-005
    module: Rooms
    type: API
    priority: P0
    automated: true
    covers: RBP-AVAIL
    summary: "TC: Availability excludes a room with an overlapping booking"
    precondition: "A room has a booking for next week."
    steps:
      - "GET /booking?roomid={id}&checkin=..&checkout=.. for the same dates"
      - "Assert the room is not offered for those dates"
    expected: "Booked rooms are excluded from availability."
  - id: TC-ROOM-006
    module: Rooms
    type: API
    priority: P1
    automated: true
    covers: RBP-INV
    summary: "TC: Room API deletes a room"
    precondition: "A room with no bookings exists."
    steps:
      - "DELETE /room/{id}"
      - "GET /room and assert the room is gone"
    expected: "The room is removed."
  - id: TC-ROOM-007
    module: Rooms
    type: UI
    priority: P2
    automated: false
    covers: RBP-INV
    summary: "TC: Room list shows price with the currency symbol"
    precondition: "At least one room exists."
    steps:
      - "Open Admin > Rooms"
      - "Assert prices are formatted with a currency symbol"
    expected: "Prices are human-readable."
  - id: TC-ROOM-008
    module: Rooms
    type: API
    priority: P1
    automated: true
    covers: RBP-INV
    summary: "TC: Room API rejects a negative price"
    precondition: "Authenticated as admin."
    steps:
      - "POST /room with price -1"
      - "Assert 4xx"
    expected: "Negative prices are rejected."
  - id: TC-ROOM-009
    module: Rooms
    type: UI
    priority: P2
    automated: true
    covers: RBP-INV
    summary: "TC: Deleting a room asks for confirmation"
    precondition: "Logged in as admin with a room present."
    steps:
      - "Click delete on a room"
      - "Assert a confirmation is required before deletion"
    expected: "Destructive actions are confirmed."
  - id: TC-ROOM-010
    module: Rooms
    type: API
    priority: P1
    automated: true
    covers: RBP-AVAIL
    summary: "TC: Room becomes available again after its booking ends"
    precondition: "A room's only booking has ended."
    steps:
      - "GET availability for a future range with no bookings"
      - "Assert the room is offered"
    expected: "The room is available again."
  - id: TC-ROOM-011
    module: Rooms
    type: API
    priority: P2
    automated: true
    covers: RBP-INV
    summary: "TC: Room API returns 404 for an unknown room id"
    precondition: "Authenticated as admin."
    steps:
      - "GET /room/999999"
      - "Assert 404"
    expected: "Unknown ids return 404."
  - id: TC-ROOM-012
    module: Rooms
    type: UI
    priority: P2
    automated: false
    covers: RBP-INV
    summary: "TC: Room form validates required fields"
    precondition: "Logged in as admin."
    steps:
      - "Submit the add-room form empty"
      - "Assert required-field errors"
    expected: "The form blocks empty submission."

  # ---------------- Auth (8) ----------------
