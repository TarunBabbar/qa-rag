    covers: RBP-AUTH
    summary: "TC: Auth API returns a token for valid credentials"
    precondition: "RBP API is reachable."
    steps:
      - "POST /auth/login with admin/password"
      - "Assert 200 and a non-empty token"
    expected: "A token is returned."
  - id: TC-AUTH-002
    module: Auth
    type: API
    priority: P0
    automated: true
    covers: RBP-AUTH
    summary: "TC: Auth API rejects invalid credentials"
    precondition: "RBP API is reachable."
    steps:
      - "POST /auth/login with admin/wrong"
      - "Assert the response has no token"
    expected: "Invalid credentials produce no token."
  - id: TC-AUTH-003
