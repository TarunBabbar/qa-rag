  - id: TC-AUTH-008
    module: Auth
    type: UI
    priority: P2
    automated: false
    covers: RBP-AUTH
    summary: "TC: Login page is keyboard accessible"
    precondition: "Admin login page is open."
    steps:
      - "Tab to username and password and log in"
